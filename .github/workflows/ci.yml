name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install duckdb numpy pandas scikit-learn pytest ruff
      - name: Run clean-room tests
        run: PYTHONPATH=. pytest -q
      - name: Lint Python
        run: ruff check .
